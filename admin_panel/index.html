<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KAMKOR — Админ-панель SOS</title>
  <style>
    :root { --green:#0b7f3a; --bg:#f4f6f8; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --danger:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--green); color:white; padding:18px 26px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    header h1 { margin:0; font-size:28px; letter-spacing:1px; }
    header button { border:1px solid rgba(255,255,255,.6); color:white; background:transparent; padding:9px 13px; border-radius:8px; cursor:pointer; display:none; }
    main { padding:24px; }
    .card { background:white; border-radius:14px; padding:22px; box-shadow:0 8px 24px rgba(0,0,0,.07); max-width:1240px; margin:0 auto; }
    .login-card { max-width:420px; margin-top:50px; }
    label { display:block; font-size:14px; font-weight:700; margin:14px 0 7px; }
    input, select { width:100%; padding:11px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; background:white; }
    button.primary { width:100%; margin-top:18px; padding:12px 14px; border:0; border-radius:8px; background:var(--green); color:white; font-weight:700; cursor:pointer; }
    button.primary:disabled { opacity:.65; cursor:not-allowed; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:15px 0 18px; }
    .toolbar select { width:auto; min-width:180px; }
    .pagination { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; margin-top:14px; }
    .pagination button { padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; background:white; cursor:pointer; }
    .pagination button:disabled { opacity:.5; cursor:not-allowed; }
    .pagination select { width:auto; min-width:90px; padding:8px 10px; }
    .geo-link { display:inline-block; padding:6px 9px; border-radius:8px; background:#eef2ff; text-decoration:none; font-weight:700; }
    .geo-raw { display:block; margin-top:4px; color:var(--muted); font-size:12px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .status-line { margin:10px 0; color:var(--muted); }
    .error { color:var(--danger); font-weight:700; margin-top:12px; white-space:pre-wrap; }
    .success { color:var(--green); font-weight:700; margin-top:12px; }
    .table-wrap { overflow:auto; border:1px solid var(--border); border-radius:12px; }
    table { width:100%; border-collapse:collapse; background:white; min-width:1000px; }
    th, td { text-align:left; border-bottom:1px solid var(--border); padding:12px 10px; vertical-align:top; font-size:14px; }
    th { background:#f9fafb; font-size:13px; text-transform:uppercase; color:#4b5563; }
    tr.status-pending { background:#fee2e2; border-left:6px solid #dc2626; }
    tr.status-pending td { color:#7f1d1d; font-weight:700; }
    tr.status-in_progress { background:#eff6ff; }
    tr.status-done { background:#ecfdf5; }
    tr.status-cancelled { background:#fef2f2; }
    .badge { display:inline-block; padding:5px 9px; border-radius:999px; font-size:12px; font-weight:700; }
    .badge.pending { background:#dc2626; color:#fff; }
    .badge.in_progress { background:#bfdbfe; color:#1d4ed8; }
    .badge.done { background:#bbf7d0; color:#047857; }
    .badge.cancelled { background:#fecaca; color:#b91c1c; }
    .small { color:var(--muted); font-size:12px; }
    .hidden { display:none !important; }
    .row-actions select { min-width:145px; }
    .row-actions button { padding:8px 10px; border:0; border-radius:7px; background:#111827; color:white; cursor:pointer; margin-top:6px; }
    .empty { padding:28px; color:var(--muted); text-align:center; }
    .pending-alert {
      width:100%;
      min-height:116px;
      margin:18px 0 22px;
      padding:22px 26px;
      border-radius:14px;
      background:linear-gradient(135deg,#b91c1c,#ef4444);
      color:white;
      display:flex;
      align-items:center;
      gap:20px;
      box-shadow:0 12px 30px rgba(185,28,28,.35);
      animation:pendingPulse 1.3s infinite;
    }
    .pending-alert-icon { font-size:48px; line-height:1; }
    .pending-alert-title { font-size:24px; font-weight:900; letter-spacing:.5px; }
    .pending-alert-count { margin-top:5px; font-size:21px; }
    .pending-alert-count strong { font-size:34px; }
    .pending-alert button {
      margin-left:auto;
      padding:10px 14px;
      border:1px solid rgba(255,255,255,.7);
      border-radius:9px;
      background:rgba(255,255,255,.14);
      color:white;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    @keyframes pendingPulse {
      0%,100% { box-shadow:0 12px 30px rgba(185,28,28,.32); }
      50% { box-shadow:0 12px 42px rgba(239,68,68,.7); }
    }
    @media (max-width:700px) {
      .pending-alert { align-items:flex-start; flex-wrap:wrap; padding:18px; }
      .pending-alert-title { font-size:20px; }
      .pending-alert button { margin-left:0; }
    }
    a { color:#1d4ed8; }
  </style>
</head>
<body>
  <header>
    <h1>KAMKOR</h1>
    <button id="logoutBtn" type="button">Выйти</button>
  </header>

  <main>
    <section id="loginView" class="card login-card">
      <h2>Вход в админку</h2>
      <div class="small">API: <span id="apiLabel"></span></div>
      <form id="loginForm">
        <label for="username">Имя пользователя</label>
        <input id="username" autocomplete="username" required placeholder="admin_bishkek_region" />
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="password" />
        <button id="loginBtn" class="primary" type="submit">Войти</button>
      </form>
      <div id="loginError" class="error"></div>
    </section>

    <section id="dashboardView" class="card hidden">
      <h2>SOS-заявки</h2>
      <div class="status-line">Данные выдаются backend-ом согласно роли администратора.</div>
      <div class="status-line">Обновление: <span id="lastUpdate">—</span></div>
      <div id="dashboardMessage" class="error"></div>

      <div id="pendingAlert" class="pending-alert hidden" role="alert" aria-live="assertive">
        <div class="pending-alert-icon">🚨</div>
        <div>
          <div class="pending-alert-title">ЕСТЬ НЕОБРАБОТАННЫЕ SOS-ЗАЯВКИ</div>
          <div class="pending-alert-count">Количество: <strong id="pendingCount">0</strong></div>
        </div>
        <button id="sirenToggleBtn" type="button">Отключить сирену</button>
      </div>

      <div class="toolbar">
        <select id="sortMode">
          <option value="new_first">Сначала новые</option>
          <option value="old_first">Сначала старые</option>
        </select>
        <select id="statusFilter">
          <option value="all">Все статусы</option>
          <option value="pending">Новые</option>
          <option value="in_progress">В обработке</option>
          <option value="done">Обработанные</option>
          <option value="cancelled">Отменённые</option>
        </select>
        <button type="button" id="refreshBtn">Обновить</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ИНН</th>
              <th>Имя пользователя</th>
              <th>Телефон</th>
              <th>Область/город</th>
              <th>Район</th>
              <th>УВД</th>
              <th>Геолокация</th>
              <th>Аудио</th>
              <th>Дата</th>
              <th>Статус</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="sosTbody"></tbody>
        </table>
        <div id="emptyBox" class="empty hidden">Заявок нет</div>
      </div>

      <div class="pagination">
        <span id="paginationInfo" class="small">—</span>
        <label class="small" for="pageSize" style="margin:0; font-weight:400;">На странице</label>
        <select id="pageSize">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <button type="button" id="prevPage">Назад</button>
        <button type="button" id="nextPage">Вперёд</button>
      </div>
    </section>
  </main>

<script>
const API_BASE = '/api';
const TOKEN_KEYS = ['admin_token', 'token'];
const POLL_MS = 15000;
let allItems = [];
let pollTimer = null;
let knownIds = new Set();
let currentPage = 1;
let previousPendingCount = null;
let audioContext = null;
let sirenOscillator = null;
let sirenGain = null;
let sirenInterval = null;
let sirenStopTimer = null;
let queuedSiren = false;
let sirenMuted = localStorage.getItem('kamkor_siren_muted') === '1';

document.getElementById('apiLabel').textContent = API_BASE;
updateSirenButton();

function getToken() {
  for (const key of TOKEN_KEYS) {
    const value = localStorage.getItem(key);
    if (value && value !== 'null' && value !== 'undefined') return value;
  }
  return null;
}

function saveToken(token) {
  if (!token) return;
  localStorage.setItem('admin_token', token);
  localStorage.setItem('token', token);
}

function clearToken() {
  TOKEN_KEYS.forEach(k => localStorage.removeItem(k));
}

function extractToken(data) {
  return data?.token || data?.auth_token || data?.access_token || data?.plainTextToken ||
         data?.data?.token || data?.data?.auth_token || data?.data?.access_token || data?.data?.plainTextToken || null;
}

function showLogin(message = '') {
  document.getElementById('dashboardView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('loginError').textContent = message;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

function showDashboard() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('dashboardView').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'inline-block';
}

function statusLabel(status) {
  return ({ pending:'Новая', in_progress:'В обработке', done:'Обработана', cancelled:'Отменена' })[status] || status || '—';
}

function updateSirenButton() {
  const btn = document.getElementById('sirenToggleBtn');
  if (!btn) return;
  btn.textContent = sirenMuted ? 'Включить сирену' : 'Отключить сирену';
}

function updatePendingAlert(count) {
  const alertBox = document.getElementById('pendingAlert');
  document.getElementById('pendingCount').textContent = count;
  alertBox.classList.toggle('hidden', count === 0);
  updateSirenButton();
}

function getAudioContext() {
  if (!audioContext) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioContext = new AudioCtx();
  }
  return audioContext;
}

function stopSiren() {
  if (sirenInterval) clearInterval(sirenInterval);
  if (sirenStopTimer) clearTimeout(sirenStopTimer);
  sirenInterval = null;
  sirenStopTimer = null;

  if (sirenOscillator) {
    try { sirenOscillator.stop(); } catch (_) {}
    try { sirenOscillator.disconnect(); } catch (_) {}
  }
  if (sirenGain) {
    try { sirenGain.disconnect(); } catch (_) {}
  }

  sirenOscillator = null;
  sirenGain = null;
}

async function playSiren(duration = 8000) {
  if (sirenMuted) return;

  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    if (ctx.state === 'suspended') await ctx.resume();
  } catch (_) {}

  if (ctx.state !== 'running') {
    queuedSiren = true;
    return;
  }

  queuedSiren = false;
  stopSiren();

  sirenOscillator = ctx.createOscillator();
  sirenGain = ctx.createGain();

  sirenOscillator.type = 'sawtooth';
  sirenOscillator.frequency.setValueAtTime(650, ctx.currentTime);
  sirenGain.gain.setValueAtTime(0.055, ctx.currentTime);

  sirenOscillator.connect(sirenGain);
  sirenGain.connect(ctx.destination);
  sirenOscillator.start();

  let high = false;
  sirenInterval = setInterval(() => {
    if (!sirenOscillator || !audioContext) return;
    high = !high;
    sirenOscillator.frequency.setTargetAtTime(
      high ? 980 : 650,
      audioContext.currentTime,
      0.08
    );
  }, 420);

  sirenStopTimer = setTimeout(stopSiren, duration);
}

document.addEventListener('click', async () => {
  const ctx = getAudioContext();
  if (ctx && ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (_) {}
  }
  if (queuedSiren && !sirenMuted) playSiren();
});

function normalizeItems(data) {
  if (Array.isArray(data)) return data;
  if (Array.isArray(data?.data)) return data.data;
  if (Array.isArray(data?.items)) return data.items;
  if (Array.isArray(data?.histories)) return data.histories;
  return [];
}

function userOf(item) { return item.user || item.User || {}; }
function uvdOf(item) { const u = userOf(item); return u.uvd_guide || u.uvdGuide || item.uvd_guide || item.uvdGuide || {}; }

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));
}

function extractCoordinates(value) {
  if (!value) return null;
  const text = String(value);
  const matches = [...text.matchAll(/-?\d+(?:\.\d+)?/g)].map(m => Number(m[0]));
  for (let i = 0; i < matches.length - 1; i++) {
    const a = matches[i];
    const b = matches[i + 1];
    const aLooksLat = Math.abs(a) <= 90;
    const bLooksLon = Math.abs(b) <= 180;
    const aLooksLon = Math.abs(a) <= 180;
    const bLooksLat = Math.abs(b) <= 90;
    if (aLooksLat && bLooksLon) return { lat: a, lon: b };
    if (aLooksLon && bLooksLat) return { lat: b, lon: a };
  }
  return null;
}

function twoGisUrlFromGeo(value) {
  const coords = extractCoordinates(value);
  if (!coords) return null;
  const lat = coords.lat.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  const lon = coords.lon.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  return `https://2gis.kg/search/${encodeURIComponent(`${lat},${lon}`)}?m=${encodeURIComponent(`${lon},${lat}/16`)}`;
}

function renderGeo(value) {
  if (!value) return '—';
  const text = String(value);
  const url = twoGisUrlFromGeo(text);
  if (url) {
    return `<a class="geo-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">Открыть в 2ГИС</a><span class="geo-raw" title="${escapeHtml(text)}">${escapeHtml(text)}</span>`;
  }
  if (text.startsWith('http')) {
    return `<a class="geo-link" href="${escapeHtml(text)}" target="_blank" rel="noopener">Открыть геопозицию</a>`;
  }
  return escapeHtml(text);
}

function getFilteredSortedItems() {
  const filter = document.getElementById('statusFilter').value;
  const sort = document.getElementById('sortMode').value;
  let items = [...allItems];
  if (filter !== 'all') items = items.filter(x => (x.status || 'pending') === filter);
  items.sort((a,b) => {
    const statusA = a.status || 'pending';
    const statusB = b.status || 'pending';
    const priorityA = statusA === 'pending' ? 0 : 1;
    const priorityB = statusB === 'pending' ? 0 : 1;

    if (priorityA !== priorityB) return priorityA - priorityB;

    const da = new Date(a.created_at || a.createdAt || 0).getTime();
    const db = new Date(b.created_at || b.createdAt || 0).getTime();
    return sort === 'new_first' ? db - da : da - db;
  });
  return items;
}

function renderTable() {
  const tbody = document.getElementById('sosTbody');
  const pageSize = Number(document.getElementById('pageSize').value || 10);
  const filteredItems = getFilteredSortedItems();
  const totalPages = Math.max(1, Math.ceil(filteredItems.length / pageSize));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  const startIndex = (currentPage - 1) * pageSize;
  const items = filteredItems.slice(startIndex, startIndex + pageSize);
  tbody.innerHTML = '';
  document.getElementById('emptyBox').classList.toggle('hidden', filteredItems.length > 0);
  document.getElementById('paginationInfo').textContent = filteredItems.length
    ? `Показано ${startIndex + 1}–${startIndex + items.length} из ${filteredItems.length}. Страница ${currentPage} из ${totalPages}`
    : 'Заявок нет';
  document.getElementById('prevPage').disabled = currentPage <= 1;
  document.getElementById('nextPage').disabled = currentPage >= totalPages;

  for (const item of items) {
    const user = userOf(item);
    const uvd = uvdOf(item);
    const status = item.status || 'pending';
    const fullName = [user.surname, user.name].filter(Boolean).join(' ') || user.full_name || user.name || '—';
    const geo = item.geo || item.geolocation || item.location || '—';
    const audio = item.audio_url || item.audio_file_url || item.audio_file || '';
    const created = item.created_at ? new Date(item.created_at).toLocaleString('ru-RU') : '—';
    const tr = document.createElement('tr');
    tr.className = `status-${status}`;
    tr.innerHTML = `
      <td>${escapeHtml(item.id)}</td>
      <td>${escapeHtml(user.pin || '—')}</td>
      <td>${escapeHtml(fullName)}</td>
      <td>${escapeHtml(user.phone_number || user.phone || '—')}</td>
      <td>${escapeHtml(uvd.region || user.region || '—')}</td>
      <td>${escapeHtml(uvd.district || user.district || '—')}</td>
      <td>${escapeHtml(user.uvd_code || uvd.code || '—')}</td>
      <td>${renderGeo(geo)}</td>
      <td>${audio ? `<a href="${escapeHtml(audio)}" target="_blank">Аудио</a>` : '—'}</td>
      <td>${escapeHtml(created)}</td>
      <td><span class="badge ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</span></td>
      <td class="row-actions">
        <select data-id="${escapeHtml(item.id)}">
          <option value="pending" ${status==='pending'?'selected':''}>Новая</option>
          <option value="in_progress" ${status==='in_progress'?'selected':''}>В обработке</option>
          <option value="done" ${status==='done'?'selected':''}>Обработана</option>
          <option value="cancelled" ${status==='cancelled'?'selected':''}>Отменена</option>
        </select><br>
        <button type="button" data-save-status="${escapeHtml(item.id)}">Сохранить</button>
      </td>`;
    tbody.appendChild(tr);
  }
}

async function apiFetch(path, options = {}) {
  const token = getToken();
  const headers = Object.assign({ 'Accept':'application/json' }, options.headers || {});
  if (token) headers.Authorization = `Bearer ${token}`;
  const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
  let data = null;
  try { data = await response.json(); } catch (_) { data = null; }
  return { response, data };
}

async function loadSos() {
  const msg = document.getElementById('dashboardMessage');
  const token = getToken();
  if (!token) {
    msg.textContent = 'Токен не найден. Войдите заново.';
    showLogin('Токен не найден. Войдите заново.');
    return;
  }
  try {
    const { response, data } = await apiFetch('/admin/sos-histories');
    console.log('sos-histories', response.status, data);
    if (response.status === 401) {
      clearToken();
      showLogin('Сессия истекла. Войдите заново.');
      return;
    }
    if (!response.ok) {
      msg.textContent = `Ошибка загрузки заявок: ${response.status}. ${data?.message || ''}`;
      return;
    }
    msg.textContent = '';
    const items = normalizeItems(data);
    const pendingCount = items.filter(x => (x.status || 'pending') === 'pending').length;
    const newItems = items.filter(x => x.id && !knownIds.has(x.id));
    const newPendingItems = newItems.filter(x => (x.status || 'pending') === 'pending');

    updatePendingAlert(pendingCount);

    // Каждые 15 секунд, после обновления данных, снова запускаем сирену,
    // пока остаётся хотя бы одна необработанная заявка.
    if (pendingCount > 0) {
      playSiren();
    } else {
      stopSiren();
    }

    previousPendingCount = pendingCount;

    if (knownIds.size && newItems.length) {
      msg.className = 'success';
      msg.textContent = `Новых SOS-заявок: ${newItems.length}`;
      setTimeout(() => { msg.className = 'error'; msg.textContent = ''; }, 5000);
    }
    allItems = items;
    knownIds = new Set(items.map(x => x.id).filter(Boolean));
    document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ru-RU');
    renderTable();
    showDashboard();
  } catch (e) {
    msg.textContent = `Ошибка сети: ${e.message}`;
    console.error(e);
  }
}

async function changeStatus(id, status) {
  const msg = document.getElementById('dashboardMessage');
  try {
    const { response, data } = await apiFetch(`/admin/sos-histories/${id}/status`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ status })
    });
    console.log('change-status', response.status, data);
    if (response.status === 401) {
      clearToken();
      showLogin('Сессия истекла. Войдите заново.');
      return;
    }
    if (!response.ok) {
      msg.textContent = `Не удалось изменить статус: ${response.status}. ${data?.message || ''}`;
      return;
    }
    await loadSos();
  } catch (e) {
    msg.textContent = `Ошибка сети: ${e.message}`;
  }
}

document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  err.textContent = '';
  try {
    const response = await fetch(`${API_BASE}/admin-user/auth`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify({ name: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
    });
    const data = await response.json().catch(() => null);
    console.log('admin login', response.status, data);
    if (!response.ok) {
      err.textContent = data?.message || `Ошибка входа: ${response.status}`;
      return;
    }
    const token = extractToken(data);
    if (!token) {
      err.textContent = 'Backend ответил 200, но токен не найден в ответе. Открой Console: admin login.';
      return;
    }
    saveToken(token);
    await loadSos();
    if (!pollTimer) pollTimer = setInterval(loadSos, POLL_MS);
  } catch (e) {
    err.textContent = `Ошибка сети: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  stopSiren();
  clearToken();
  showLogin();
});

document.getElementById('sirenToggleBtn').addEventListener('click', () => {
  sirenMuted = !sirenMuted;
  localStorage.setItem('kamkor_siren_muted', sirenMuted ? '1' : '0');
  updateSirenButton();

  if (sirenMuted) {
    stopSiren();
  } else {
    const pendingCount = allItems.filter(x => (x.status || 'pending') === 'pending').length;
    if (pendingCount > 0) playSiren();
  }
});
document.getElementById('refreshBtn').addEventListener('click', loadSos);
document.getElementById('sortMode').addEventListener('change', () => { currentPage = 1; renderTable(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(); });
document.getElementById('pageSize').addEventListener('change', () => { currentPage = 1; renderTable(); });
document.getElementById('prevPage').addEventListener('click', () => { currentPage = Math.max(1, currentPage - 1); renderTable(); });
document.getElementById('nextPage').addEventListener('click', () => { currentPage += 1; renderTable(); });
document.getElementById('sosTbody').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-save-status]');
  if (!btn) return;
  const id = btn.getAttribute('data-save-status');
  const select = document.querySelector(`select[data-id="${CSS.escape(id)}"]`);
  if (select) changeStatus(id, select.value);
});

if (getToken()) {
  showDashboard();
  loadSos();
  pollTimer = setInterval(loadSos, POLL_MS);
} else {
  showLogin();
}
</script>
</body>
</html>
