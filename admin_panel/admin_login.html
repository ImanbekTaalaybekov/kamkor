<!-- login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход администратора</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f2f2f2; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 15px; }
        .login-box button { width: 100%; padding: 10px; background: green; color: white; border: none; border-radius: 5px; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Вход администратора</h2>
    <input type="text" id="name" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <div id="error" class="error"></div>
</div>

<script>
    async function login() {
        const name = document.getElementById('name').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error');
        errorBox.textContent = '';

        try {
            const res = await fetch('kamkor.mvd.kg/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, password })
            });

            const data = await res.json();

            if (!res.ok) {
                errorBox.textContent = data.message || 'Ошибка входа';
                return;
            }

            const user = data.user;

            localStorage.setItem('token', data.token);
            localStorage.setItem('admin_name', user.name);
            localStorage.setItem('admin_role', user.role);
            localStorage.setItem('admin_region', user.region || '');
            localStorage.setItem('admin_district', user.district || '');
            localStorage.setItem('admin_uvd_code', user.uvd_code || '');

            window.location.href = '/admin_dashboard.html';
        } catch (err) {
            errorBox.textContent = 'Ошибка сети';
        }
    }
</script>
</body>
</html>
